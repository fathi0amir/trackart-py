[project]
name = "trackart"
version = "2.6.3"
description = "Python port of TrackArt - single particle tracking data analysis and simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.scripts]
trackart = "trackart.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackart"]
